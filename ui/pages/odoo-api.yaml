page_id: odoo-api
title: Odoo API
description: 'Every Odoo step: what it does, which Odoo calls it makes, its inputs and results.'
components:
- component_id: operations_everyday
  type: markdown
  title: Everyday operations
  body: |
    These steps take plain inputs and make the Odoo calls for you. The generic steps after them work on any model, named **Advanced · …** in the step picker.

    ### Test the connection

    Reads the Odoo version and makes one authenticated read to check the address, database and API key.

    - Action id: `test_connection`
    - Kind: read
    - Odoo calls: `/web/webclient/version_info`, `res.users context_get`
    - Inputs: none
    - Results: `connected`, `odoo_version`, `server_version`, `api`, `language`

    ### Find or create partner

    Looks the partner (customer or supplier) up by reference, then VAT, then e-mail; several matches or conflicting values are an error. Creates it only when none matches.

    - Action id: `find_or_create_partner`
    - Kind: write
    - Odoo calls: `res.partner search_read`, `res.partner create`
    - Inputs: `ref` (optional), `vat` (optional), `email` (optional), `name` (optional), `is_company` (optional), `phone` (optional), `street` (optional), `city` (optional), `zip` (optional), `country_code` (optional)
    - Results: `partner_id`, `created`, `matched_by`, `record`

    ### Find or create product

    Looks the product up by internal reference, then barcode; creates it when none matches, as goods (optionally stocked) or a service, with the right fields for the Odoo version.

    - Action id: `find_or_create_product`
    - Kind: write
    - Odoo calls: `product.product search_read`, `product.product create`
    - Inputs: `product_code` (optional), `barcode` (optional), `name` (optional), `kind` (optional), `storable` (optional), `list_price` (optional)
    - Results: `product_id`, `created`, `matched_by`, `record`

    ### Create customer invoice

    Creates a customer invoice (account.move) with its lines in one request, after finding — or creating — the partner; can attach a file and post it. With a reference, a rerun returns the customer invoice already created for the same partner and date instead of a second one.

    - Action id: `create_customer_invoice`
    - Kind: write
    - Odoo calls: `res.partner search_read / create`, `account.move search_read / create`, `ir.attachment create`, `account.move action_post`
    - Needs the Odoo app: `account`
    - Inputs: `partner_id` (optional), `partner_ref` (optional), `partner_vat` (optional), `partner_email` (optional), `partner_name` (optional), `reference` (optional), `invoice_date` (optional), `due_date` (optional), `currency_code` (optional), `notes` (optional), `lines`, `post` (optional), `document_file` (optional)
    - Results: `invoice_id`, `number`, `state`, `created`, `partner_id`, `partner_created`, `total_untaxed`, `total_tax`, `total`, `amount_due`, `attachment_id`, `posted`, `record`

    ### Create vendor bill

    Creates a vendor bill (account.move) with its lines in one request, after finding — or creating — the partner; can attach a file and post it. With a reference, a rerun returns the vendor bill already created for the same partner and date instead of a second one.

    - Action id: `create_vendor_bill`
    - Kind: write
    - Odoo calls: `res.partner search_read / create`, `account.move search_read / create`, `ir.attachment create`, `account.move action_post`
    - Needs the Odoo app: `account`
    - Inputs: `partner_id` (optional), `partner_ref` (optional), `partner_vat` (optional), `partner_email` (optional), `partner_name` (optional), `reference` (optional), `invoice_date` (optional), `due_date` (optional), `currency_code` (optional), `notes` (optional), `lines`, `post` (optional), `document_file` (optional)
    - Results: `invoice_id`, `number`, `state`, `created`, `partner_id`, `partner_created`, `total_untaxed`, `total_tax`, `total`, `amount_due`, `attachment_id`, `posted`, `record`

    ### Register payment

    Pays a posted invoice or bill in full or in part with Odoo's payment wizard, which creates, posts and reconciles the payment. An invoice already paid, or the same payment (memo, amount, date) found again, is not paid twice. Without a memo a partial payment run again is registered again.

    - Action id: `register_payment`
    - Kind: write
    - Odoo calls: `account.move read`, `account.payment search_read`, `account.payment.register create`, `account.payment.register action_create_payments`
    - Needs the Odoo app: `account`
    - Inputs: `invoice_id`, `amount` (optional), `payment_date` (optional), `journal_code` (optional), `memo` (optional)
    - Results: `invoice_id`, `created`, `payment_state`, `amount_due`

    ### Create sale order

    Creates a quotation with its lines after finding — or creating — the customer, and can confirm it into a sale order. With a reference, a rerun returns the order already created.

    - Action id: `create_sale_order`
    - Kind: write
    - Odoo calls: `res.partner search_read / create`, `sale.order search_read / create`, `sale.order action_confirm`
    - Needs the Odoo app: `sale`
    - Inputs: `partner_id` (optional), `partner_ref` (optional), `partner_vat` (optional), `partner_email` (optional), `partner_name` (optional), `reference` (optional), `order_date` (optional), `lines`, `confirm` (optional)
    - Results: `order_id`, `number`, `state`, `created`, `partner_id`, `partner_created`, `total`, `confirmed`, `record`

    ### Stock levels

    Quantities on hand, reserved and available in internal locations, per product, location and lot.

    - Action id: `stock_levels`
    - Kind: read
    - Odoo calls: `stock.quant search_read`
    - Needs the Odoo app: `stock`
    - Inputs: `product_id` (optional), `product_code` (optional), `location_id` (optional), `limit` (optional), `offset` (optional)
    - Results: `items`, `count`, `totals`, `has_more`, `next_offset`

    ### Product prices

    A product's sales price, list price and cost, and the pricelist rules for it. Odoo's computed pricelist price is a private method and cannot be called through the API.

    - Action id: `product_prices`
    - Kind: read
    - Odoo calls: `product.product read`, `product.pricelist.item search_read`
    - Inputs: `product_id` (optional), `product_code` (optional), `pricelist_id` (optional)
    - Results: `product_id`, `product`, `sales_price`, `list_price`, `cost`, `currency`, `unit`, `pricelist_rules`

    ### Changes since

    Records of one kind changed at or after a moment (write_date), oldest first, archived ones included. To continue, pass next_since as since and next_after_id as after_id: no record is skipped. The last second read may come again on the next call; match records by id.

    - Action id: `changes_since`
    - Kind: read
    - Odoo calls: `<model> search_read on write_date`
    - Inputs: `entity`, `since`, `after_id` (optional), `fields` (optional), `limit` (optional)
    - Results: `model`, `records`, `count`, `has_more`, `next_since`, `next_after_id`

    ### Partner balance

    What a partner owes and is owed: Odoo's receivable and payable totals, and the open invoices and bills with what is still due and what is overdue.

    - Action id: `partner_balance`
    - Kind: read
    - Odoo calls: `res.partner read`, `account.move search_read`
    - Needs the Odoo app: `account`
    - Inputs: `partner_id` (optional), `partner_ref` (optional), `partner_vat` (optional), `partner_email` (optional), `limit` (optional), `offset` (optional)
    - Results: `partner_id`, `partner`, `receivable`, `payable`, `open_receivable`, `open_payable`, `overdue_receivable`, `overdue_payable`, `documents`, `count`, `complete`, `next_offset`

    ### Attach file to a record

    Attaches a workflow file to any record (an invoice, an order, a partner) and can make it the record's main attachment.

    - Action id: `attach_file`
    - Kind: write
    - Odoo calls: `ir.attachment create`, `<model> write message_main_attachment_id`
    - Inputs: `model`, `record_id`, `document_file`, `file_name` (optional), `set_main` (optional)
    - Results: `attachment_id`, `model`, `record_id`, `main_set`

    ### Download attachment

    Saves a file attached in Odoo as a workflow file: by attachment id, or the newest file on a record (optionally by name).

    - Action id: `download_attachment`
    - Kind: read
    - Odoo calls: `ir.attachment read / search_read`
    - Inputs: `attachment_id` (optional), `model` (optional), `record_id` (optional), `file_name` (optional)
    - Results: `found`, `document_file`, `attachment_id`, `file_name`, `mimetype`, `size_bytes`
- component_id: operations_behaviour
  type: markdown
  title: How operations behave
  body: |
    ### Odoo versions and APIs

    - Odoo 16, 17 and 18 are reached through XML-RPC; Odoo 19 and 20 through the JSON-2 API (or XML-RPC, which Odoo still offers until Odoo 22). The connection says which.
    - Field names that changed between versions are chosen per version by the extension (for example the unit on sale order lines, the stock unit, product types, attachment content, the payment memo).
    - Every step works with the rights of the API key's user.

    ### Inputs

    - Models are Odoo's technical names (res.partner, account.move). Field names in domains, field lists and values are checked against the model before anything is sent.
    - Domains are lists of [field, operator, value] with "&", "|" and "!". Only the standard operators are accepted.
    - Numbers are written with "." as the decimal point; amounts and quantities are exact decimals.

    ### Writes, retries and errors

    - Flow Steward remembers every create, update, delete, post, confirm, payment and method call it made, so a retried step does not send it twice. Test runs never write.
    - Each Odoo call runs in its own database transaction. When Odoo itself refuses a call — a validation error, missing rights, a missing record, a locked record — nothing was saved and the step says so.
    - A business method (posting an invoice, confirming an order, registering a payment, any method you call) may contact outside services, such as e-invoicing, before it fails. A server error on one of these, a timeout or a lost connection is reported as an unknown outcome and is not retried: check the record in Odoo first.
    - Everyday steps look up before they create (partners, products, invoices with a reference, orders with a reference, payments with a memo), so running one again after an unknown outcome finds what the first run made.
    - If a step that writes several things fails half-way, it says exactly what was already created.

    ### Lists and files

    - Lists come in pages (limit, offset). A step output has a size limit: a long read stops at a page boundary and returns next_offset. For whole tables use Export records.
    - Files travel as workflow files: attach one to any record, or download an attachment.
- component_id: operations_generic
  type: markdown
  title: Any model
  body: |
    ### Search records

    Reads the records of any model that match a domain (search_read), page by page.

    - Action id: `search_records`
    - Kind: read
    - Odoo calls: `<model> fields_get`, `<model> search_read`
    - Inputs: `model`, `domain` (optional), `fields` (optional), `order` (optional), `limit` (optional), `offset` (optional), `fetch_all_pages` (optional), `max_pages` (optional)
    - Results: `model`, `records`, `record`, `count`, `next_offset`, `has_more`

    ### Read records by id

    Reads records of any model by id.

    - Action id: `read_records`
    - Kind: read
    - Odoo calls: `<model> read`
    - Inputs: `model`, `ids`, `fields` (optional)
    - Results: `model`, `records`, `record`, `count`

    ### Count records

    Counts the records of any model that match a domain.

    - Action id: `count_records`
    - Kind: read
    - Odoo calls: `<model> search_count`
    - Inputs: `model`, `domain` (optional)
    - Results: `model`, `count`

    ### Group and total records

    Groups records by fields and totals them (read_group), in the form each Odoo version uses.

    - Action id: `group_records`
    - Kind: read
    - Odoo calls: `<model> read_group`
    - Inputs: `model`, `domain` (optional), `groupby` (optional), `aggregates` (optional), `limit` (optional)
    - Results: `model`, `groups`, `count`

    ### Describe a model's fields

    Lists a model's fields with their labels, types, relations and whether they are required or read-only.

    - Action id: `describe_fields`
    - Kind: read
    - Odoo calls: `<model> fields_get`
    - Inputs: `model`
    - Results: `model`, `fields`, `count`

    ### Create a record

    Creates one record of any model with field values (names checked against the model).

    - Action id: `create_record`
    - Kind: write
    - Odoo calls: `<model> create`
    - Inputs: `model`, `values`
    - Results: `model`, `id`

    ### Update records

    Writes the same field values on records of any model.

    - Action id: `update_records`
    - Kind: write
    - Odoo calls: `<model> write`
    - Inputs: `model`, `ids`, `values`
    - Results: `model`, `ids`, `updated`

    ### Delete records

    Deletes records of any model.

    - Action id: `delete_records`
    - Kind: write
    - Odoo calls: `<model> unlink`
    - Inputs: `model`, `ids`
    - Results: `model`, `ids`, `deleted`

    ### Call a model method

    Calls a public method of any model (for example action_post, action_confirm), on records or on the model. A server error is reported as an unknown outcome, never retried.

    - Action id: `call_method`
    - Kind: write
    - Odoo calls: `<model> <method>`
    - Inputs: `model`, `method`, `ids` (optional), `kwargs` (optional)
    - Results: `model`, `method`, `result`

    ### Export records to a JSONL file

    Reads every record of any model that matches a domain, 200 at a time, into a JSON-lines workflow file.

    - Action id: `export_records`
    - Kind: read
    - Odoo calls: `<model> search_read`
    - Inputs: `model`, `domain` (optional), `fields` (optional), `order` (optional), `start_offset` (optional), `max_pages` (optional)
    - Results: `artifact_handle`, `filename`, `content_type`, `record_count`, `pages_fetched`, `complete`, `resume_offset`, `stopped_by`
- component_id: operations_coverage
  type: markdown
  title: Coverage
  body: |
    - **Covered:** every model of the database through the generic steps — search, read, count, group and total, describe fields, create, update, delete, call a public method, export — on Odoo 16 to 20, plus the everyday steps above.
    - **APIs:** [JSON-2](https://www.odoo.com/documentation/19.0/developer/reference/external_api.html) (Odoo 19+) and [XML-RPC](https://www.odoo.com/documentation/18.0/developer/reference/external_api.html) (Odoo 16-20; [deprecated since 19, removed in Odoo 22](https://www.odoo.com/documentation/19.0/developer/reference/external_rpc_api.html)). The ORM methods are Odoo's own ([ORM reference](https://www.odoo.com/documentation/19.0/developer/reference/backend/orm.html)).
    - **Not offered: the computed pricelist price.** Odoo computes it in private methods (names starting with _), which Odoo does not let any API call. Product prices returns the product's prices and the pricelist rules instead.
    - **Not offered: private methods.** Odoo refuses them over every API.
    - **Not offered: the database service** (create, copy or drop databases); Odoo removed it from the API in Odoo 20.
    - **Not offered: Odoo's own MCP server.** It is a separate integration (Odoo 20, read-only by default); this extension uses the documented external APIs for typed workflow steps.
