# Push a tag matching extension.yaml's version (`git tag v1.0.1 && git push --tags`).
# The release publishes exactly what CI built and checked; the Flow Steward
# extension catalog picks it up within the hour.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match extension.yaml
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' extension.yaml | tr -d "'\"")
          test "${GITHUB_REF_NAME}" = "v${version}" \
            || { echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }

  ci:
    needs: tag
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Release notes from CHANGELOG.md
        # The section "## <version> — <date>" up to the next "## ", then the changelog link.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { inside = (index($0, "## " v " ") == 1) ; next }
            inside { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for ${version}"; exit 1; }
          printf '\n**Full Changelog**: %s/%s/commits/%s\n' \
            "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" >> notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" dist/*.zip
          --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file notes.md
