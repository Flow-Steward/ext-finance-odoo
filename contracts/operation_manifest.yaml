- operation_id: export_records
  display_name: Advanced · Export records to a JSONL file
  description: Reads every record of any model that matches a domain, 200 at a time, into a JSON-lines
    workflow file.
  operation_kind: source
  category: finance
  connection_type_ids:
  - odoo
  workflow_visible: true
  inputs:
  - *id001
  - *id011
  - *id014
  - *id012
  - *id016
  - name: start_offset
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 0
      maximum: 1000000000
      title: Start offset
      description: Where to start; pass resume_offset of an unfinished export.
  - name: max_pages
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 2000
      title: Max pages
      description: Upper bound of pages of 200. Default 2000.
  outputs:
  - name: artifact_handle
    value_type: artifact_handle
  - name: filename
    value_type: text
    schema:
      type: string
  - name: content_type
    value_type: text
    schema:
      type: string
  - name: record_count
    value_type: integer
    schema:
      type: integer
  - name: pages_fetched
    value_type: integer
    schema:
      type: integer
  - name: complete
    value_type: boolean
    schema:
      type: boolean
  - name: resume_offset
    value_type: integer
    schema:
