- operation_id: call_method
  display_name: Advanced · Call a model method
  description: Calls a public method of any model (for example action_post, action_confirm), on records
    or on the model. A server error is reported as an unknown outcome, never retried.
  operation_kind: action
  category: finance
  connection_type_ids:
  - odoo
  workflow_visible: true
  effect_kind: odoo_call_method
  inputs:
  - *id001
  - *id011
  - name: method
    value_type: text
    required: true
    schema:
      type: string
      title: Method
      description: The method name, for example action_post. Names starting with _ are private and refused.
      maxLength: 80
      pattern: ^[a-z][a-z0-9_]{0,80}$
  - name: ids
    value_type: array
    required: false
    schema:
      type: array
      title: Record ids
      description: The records to call it on. Leave empty for a model method.
      maxItems: 1000
      items:
        type: integer
  - name: kwargs
    value_type: object
    required: false
    schema:
      type: object
      title: Arguments
      description: 'Named arguments, for example {"context": {"lang": "lt_LT"}}.'
  outputs:
  - name: model
    value_type: text
    schema:
      type: string
  - name: method
    value_type: text
    schema:
      type: string
  - name: result
    value_type: json
    schema:
      description: What the method returned.
  - name: external_effect_status
    value_type: text
    schema:
      type: string
  - name: definitely_no_external_effect
    value_type: boolean
    schema:
      type: boolean
  result_fields:
  - result.model
  - result.method
  - result.result
  - result.external_effect_status
  - result.definitely_no_external_effect
