- operation_id: register_payment
  display_name: Register payment
  description: Pays a posted invoice or bill in full or in part with Odoo's payment wizard, which creates,
    posts and reconciles the payment. An invoice already paid, or the same payment (memo, amount, date)
    found again, is not paid twice. Without a memo a partial payment run again is registered again.
  operation_kind: action
  category: finance
  connection_type_ids:
  - odoo
  workflow_visible: true
  effect_kind: odoo_register_payment
  inputs:
  - *id001
  - name: invoice_id
    value_type: integer
    required: true
    schema:
      type: integer
      minimum: 1
      maximum: 1000000000
      title: Invoice id
      description: The posted invoice or bill to pay.
  - name: amount
    value_type: text
    required: false
    schema:
      type:
      - string
      - number
      title: Amount
      description: 'The amount paid. Default: the amount still due.'
  - name: payment_date
    value_type: text
    required: false
    schema:
      type: string
      title: Date
      description: 'The payment date, YYYY-MM-DD. Default: today.'
      maxLength: 10
      pattern: ^\d{4}-\d{2}-\d{2}$
  - name: journal_code
    value_type: text
    required: false
    schema:
      type: string
      title: Journal
      description: 'The bank or cash journal''s short code. Default: Odoo''s choice.'
      maxLength: 20
  - name: memo
    value_type: text
    required: false
    schema:
      type: string
      title: Memo
      description: The payment memo; with it a rerun finds the same payment instead of paying twice.
      maxLength: 200
  outputs:
  - name: invoice_id
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
  - name: created
    value_type: boolean
    schema:
      type: boolean
      description: False when the invoice was already paid or the same payment exists.
  - name: payment_state
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: not_paid, partial, in_payment or paid.
  - name: amount_due
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: Amount still due, exact decimal.
  - name: external_effect_status
    value_type: text
    schema:
      type: string
  - name: definitely_no_external_effect
    value_type: boolean
    schema:
      type: boolean
  result_fields:
