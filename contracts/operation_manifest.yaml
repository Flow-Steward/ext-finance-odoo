- operation_id: changes_since
  display_name: Changes since
  description: 'Records of one kind changed at or after a moment (write_date), oldest first, archived
    ones included. To continue, pass next_since as since and next_after_id as after_id: no record is skipped.
    The last second read may come again on the next call; match records by id.'
  operation_kind: source
  category: finance
  connection_type_ids:
  - odoo
  workflow_visible: true
  inputs:
  - *id001
  - name: entity
    value_type: text
    required: true
    schema:
      type: string
      enum:
      - invoices_and_bills
      - partners
      - payments
      - products
      - sale_orders
      - stock_quants
      title: What
      description: The kind of records to read.
  - name: since
    value_type: text
    required: true
    schema:
      type: string
      title: Since
      description: YYYY-MM-DD or YYYY-MM-DD HH:MM:SS, in UTC. Records changed at this moment are included.
      maxLength: 19
      pattern: ^\d{4}-\d{2}-\d{2}( \d{2}:\d{2}:\d{2})?$
  - name: after_id
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 1000000000
      title: After id
      description: Pass next_after_id from the previous call, with its next_since as since.
  - &id012
    name: fields
    value_type: array
    required: false
    schema:
      type: array
      title: Fields
      description: 'The field names to return, for example ["name", "email"]. Default: id and display
        name.'
      maxItems: 200
      items:
        type: string
  - *id009
  outputs:
  - name: model
    value_type: text
    schema:
      type: string
  - &id013
    name: records
    value_type: array
    schema:
      type: array
      description: The records, with the requested fields.
  - name: count
    value_type: integer
    schema:
      type: integer
  - name: has_more
    value_type: boolean
    schema:
      type: boolean
  - name: next_since
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: Pass it as since to continue.
  - name: next_after_id
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: Pass it as after_id to continue; null means leave after_id empty.
  result_fields:
  - result.model
  - result.records
  - result.count
  - result.has_more
  - result.next_since
  - result.next_after_id
